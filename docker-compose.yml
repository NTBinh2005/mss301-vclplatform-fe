services:
  fe:
    build: .
    image: signmentor-fe
    ports:
      - "3000:80"
    # nginx proxies /api to http://api-gateway:8080, so this container must share
    # a network with the gateway. Set the external network name below to match
    # the one your MSS backend compose file uses.
    networks:
      - mss

networks:
  mss:
    name: mss-network
    external: true
