# CI: mỗi lần push / mở PR → kiểm tra kiểu TypeScript + build bản production.
# Deploy do repo backend (TrucFPTU/mss301-vslplatform-project) lo: Actions → Deploy → Run workflow.
name: CI

on:
  push:
    branches: [dev, main, "feature/**", "fix/**"]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
